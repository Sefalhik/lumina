<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <defs>
        <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="1.5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <rect width="32" height="32" rx="5" fill="#09090f"/>
    <!-- Diamond with inner diamond (◈) — cyan -->
    <g filter="url(#glow)">
        <polygon points="16,3 29,16 16,29 3,16" fill="none" stroke="#5ec8ea" stroke-width="2" stroke-linejoin="miter"/>
        <polygon points="16,10 22,16 16,22 10,16" fill="#5ec8ea"/>
    </g>
</svg>
