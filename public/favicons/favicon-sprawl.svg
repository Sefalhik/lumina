<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <defs>
        <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="1.5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <rect width="32" height="32" rx="5" fill="#0c0d12"/>
    <!-- Flat-top hexagon (⬡) — terminal green -->
    <polygon
        points="28,16 22,26.4 10,26.4 4,16 10,5.6 22,5.6"
        fill="none"
        stroke="#4dff5c"
        stroke-width="2"
        stroke-linejoin="round"
        filter="url(#glow)"
    />
</svg>
